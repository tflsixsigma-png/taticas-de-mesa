<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14264C">
<title>Táticas de mesa</title>
<style>
  :root {
    --navy: #14264C; --navy-deep: #0D1A36; --gold: #C9A227; --gold-ink: #7A5F08;
    --ink: #111827; --muted: #4B5563; --line: #D5DAE5; --paper: #FFFFFF; --tint: #EEF1F7;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Cambria, Caladea, "Liberation Serif", Georgia, serif;
    font-size: 18px; line-height: 1.45;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--navy); color: #fff; padding: calc(14px + var(--sat)) 20px 14px;
    display: flex; align-items: center; gap: 12px; flex: none;
  }
  header h1 { font-size: 22px; margin: 0; flex: 1; line-height: 1.2; }
  header .back { background: none; border: 0; color: var(--gold); font: inherit; font-size: 18px; font-weight: bold; padding: 6px 4px; cursor: pointer; display: none; }
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view { display: none; } .view.on { display: block; }
  nav {
    flex: none; display: flex; border-top: 2px solid var(--line); background: var(--paper);
    padding-bottom: var(--sab);
  }
  nav button {
    flex: 1; border: 0; background: none; font: inherit; font-size: 15px; font-weight: bold;
    color: var(--muted); padding: 12px 0 10px; cursor: pointer;
  }
  nav button[aria-current="page"] { color: var(--navy); box-shadow: inset 0 3px 0 var(--gold); }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* lista */
  .lista { padding: 8px 0 24px; }
  .lista h2.grupo { font-size: 15px; color: var(--gold-ink); margin: 22px 20px 6px; }
  .lista p.intro { padding: 12px 20px 6px; margin: 0; color: var(--muted); font-size: 16px; }
  .tat {
    display: flex; align-items: center; width: 100%; gap: 14px;
    padding: 16px 20px; border: 0; border-bottom: 1px solid var(--line);
    background: none; text-align: left; font: inherit; cursor: pointer;
  }
  .tat .tx { flex: 1; }
  .tat .nome { font-size: 21px; font-weight: bold; color: var(--navy); }
  .tat .quando { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .estrela {
    flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line);
    background: none; font-size: 22px; color: var(--line); cursor: pointer;
  }
  .estrela[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--navy); }

  /* detalhe */
  .seg { display: flex; margin: 16px 20px 0; border: 2px solid var(--navy); border-radius: 999px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: none; font: inherit; font-weight: bold; font-size: 16px; padding: 10px; color: var(--navy); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .painel { display: none; } .painel.on { display: block; }

  .mesa { background: var(--navy); color: #fff; margin: 16px 0 0; padding: 22px 20px 28px; }
  .mesa .quando { color: var(--gold); font-size: 17px; margin: 0 0 18px; }
  .mesa .fala { font-size: 26px; line-height: 1.3; margin: 0 0 18px; padding-left: 16px; border-left: 4px solid var(--gold); }
  .mesa .evite { margin-top: 26px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.25); }
  .mesa .evite p { margin: 0 0 6px; font-size: 17px; color: #E5E7EB; }
  .mesa .evite p b { color: #fff; }
  .bloco { padding: 18px 20px; }
  .bloco h2 { font-size: 18px; color: var(--navy); margin: 0 0 8px; }
  .bloco p { margin: 0 0 10px; }
  .bloco ul { margin: 0; padding-left: 20px; } .bloco li { margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 90px; font: inherit; font-size: 17px; padding: 10px 12px;
    border: 2px solid var(--line); border-radius: 8px; resize: vertical; color: var(--ink);
  }
  textarea:focus { border-color: var(--navy); }
  .salvo { font-size: 14px; color: var(--muted); margin: 6px 0 0; min-height: 1.2em; }
  .tela { position: relative; width: 100%; max-width: 360px; aspect-ratio: 9/16; background: var(--navy); border-radius: 10px; overflow: hidden; margin: 4px auto 10px; }
  .tela iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--navy); color: #fff; font: inherit; font-size: 20px; font-weight: bold; cursor: pointer; }
  .play::before { content: ""; display: block; width: 0; height: 0; margin: 0 auto 14px; border-left: 28px solid var(--gold); border-top: 18px solid transparent; border-bottom: 18px solid transparent; }
  .link { color: var(--navy); font-weight: bold; font-size: 15px; }
  .btn {
    display: inline-block; font: inherit; font-weight: bold; font-size: 16px; padding: 12px 20px;
    border-radius: 999px; border: 2px solid var(--navy); background: var(--navy); color: #fff; cursor: pointer;
  }
  .btn.claro { background: none; color: var(--navy); }
  .btn.ouro { background: var(--gold); border-color: var(--gold); color: var(--navy); }

  /* minha mesa */
  .vazio { padding: 40px 20px; text-align: center; color: var(--muted); }
  .minha .mesa { margin: 0; border-bottom: 1px solid rgba(255,255,255,.2); padding-top: 18px; padding-bottom: 20px; }
  .minha .mesa h2 { margin: 0 0 4px; font-size: 20px; color: #fff; }
  .minha .mesa .fala { font-size: 23px; margin-bottom: 12px; }
  .minha .quadro { background: var(--gold); color: var(--navy); border-radius: 10px; padding: 16px 18px; margin: 18px 0 4px; }
  .minha .quadro h3 { margin: 0 0 10px; font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-ink); }
  .minha .quadro p { margin: 0 0 10px; font-size: 26px; line-height: 1.25; font-weight: bold; }
  .minha .quadro p:last-child { margin-bottom: 0; }
  @media (min-width: 720px) { main > .view { max-width: 720px; margin: 0 auto; } }
  @media (prefers-reduced-motion: no-preference) { .estrela, .seg button, nav button { transition: background .15s, color .15s; } }
</style>
</head>
<body>

<header>
  <button class="back" id="back" type="button" aria-label="Voltar">‹ Táticas</button>
  <h1 id="titulo">Táticas de mesa</h1>
</header>

<main>
  <section class="view on" id="v-lista">
    <div class="lista">
      <p class="intro">Dezoito táticas. Toque numa para estudar ou consultar. Marque com a estrela as que vai levar para a próxima mesa.</p>
      <div id="lista"></div>
    </div>
  </section>

  <section class="view" id="v-detalhe"></section>

  <section class="view" id="v-minha"></section>
</main>

<nav aria-label="Seções">
  <button type="button" data-v="lista" aria-current="page">Táticas</button>
  <button type="button" data-v="minha">Minha mesa</button>
</nav>

<script>

    preparo: ["Prepare a frase de abertura sobre justiça.", "Identifique o ponto da sua proposta que pode parecer injusto ao outro lado."],
    video: "26dfd1fdbefe41919fedb6f8c40fce84" },
  { g: "Confiança e preparo", id: "sinais", nome: "Os seis sinais de confiança",

    evite: [["Exigir os seis sinais", "dois ou três sinais fortes já dizem muito."], ["Encerrar a negociação quando um sinal falta", "proteja-se naquele ponto, com prazos, garantias ou marcos."]],
    resumo: "Em vez de perguntar \u201cposso confiar?\u201d, pergunte \u201cconsigo prever como ela vai agir?\u201d. Os seis sinais ajudam a responder. Quando um sinal falta, você não encerra a negociação: protege-se naquele ponto.",
    preparo: ["Para a sua contraparte, marque quais dos seis sinais você já observou.", "Para os que faltam, defina a proteção: prazo, garantia ou marco de entrega."],
    video: "58c28997cc954cb58050d07eef50e659" },
  { g: "Confiança e preparo", id: "codigo", nome: "O código da confiança",
    quando: "Durante toda a conversa, como postura.",
    falas: ["Suspenda o ego: o foco da conversa é o outro lado.", "Não julgue: entenda antes de avaliar.", "Valide: reconheça as pressões da outra parte, mesmo sem concordar.", "Honre a razão: diga o que quer e por quê, sem jogo escondido.", "Seja generoso com tempo, atenção e informação útil."],
    evite: [["Confundir generosidade com concessão de graça", "generosidade aqui é de atenção, não de preço."]],
    resumo: "Confiança não se pede. Ela surge quando a outra parte percebe que a conversa também é sobre ela, e não só sobre você. Os cinco princípios são uma postura para toda a conversa, não uma técnica pontual.",
    preparo: ["Anote quanto tempo você pretende falar dos objetivos da outra parte.", "Escolha o princípio em que você mais costuma falhar e o vigie na mesa."],

  { g: "Confiança e preparo", id: "historia", nome: "A história que você conta a si mesmo",
    quando: "Antes da reunião, quando você já concluiu algo sobre a outra parte.",
    falas: ["O que eu observei? Só o fato.", "O que eu inferi? A interpretação que acrescentei.", "Qual é o ponto de vista deles? Duas razões possíveis do lado de lá."],
    evite: [["Negociar contra a história, e não contra os fatos", "é o erro mais caro da preparação."]],
    resumo: "A história mais perigosa é a que você conta a si mesmo sobre a outra parte. Deixe os sentimentos de fora e não suponha informação: colete. Anote uma coisa que a outra parte fez e três razões possíveis, uma do seu ponto de vista e duas do dela. As duas últimas são as mais difíceis, e é nelas que estão as perguntas que você precisa fazer.",
    preparo: ["Anote uma coisa que a outra parte fez.", "Escreva uma razão do seu ponto de vista e duas do ponto de vista dela.", "Transforme as duas últimas em perguntas para a mesa."],
    video: "9f4acb3890664baf86c2ab819ed463a2" }
];

const KEY = "negociacao-taticas-v1";
let S = { picks: [], notes: {}, debrief: "" };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let atual = null;

function show(v, titulo) {
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
  document.querySelectorAll("nav button").forEach(b => {
    const on = b.dataset.v === v || (v === "detalhe" && b.dataset.v === "lista");
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  $("#titulo").textContent = titulo || (v === "minha" ? "Minha mesa" : "Táticas de mesa");
  $("#back").style.display = v === "detalhe" ? "block" : "none";
  $("main").scrollTop = 0;
}

function estrela(t) {
  const on = S.picks.includes(t.id);
  return `<button class="estrela" type="button" data-pick="${t.id}" aria-pressed="${on}" aria-label="Levar ${esc(t.nome)} para a mesa">★</button>`;
}
function renderLista() {
  let g = "";
  $("#lista").innerHTML = T.map(t => (t.g !== g ? `<h2 class="grupo">${(g = t.g)}</h2>` : "") + `
    <div style="display:flex;align-items:center;border-bottom:1px solid var(--line)">
      <button class="tat" type="button" data-open="${t.id}" style="border:0">
        <span class="tx"><span class="nome">${esc(t.nome)}</span><br><span class="quando">${esc(t.quando)}</span></span>
      </button>
      <span style="padding-right:16px">${estrela(t)}</span>
    </div>`).join("");
}

function renderDetalhe(t, modo) {
  atual = t;
  const nota = S.notes[t.id] || "";
  $("#v-detalhe").innerHTML = `
    <div class="seg" role="group" aria-label="Modo">
      <button type="button" data-modo="mesa" aria-pressed="${modo === "mesa"}">Na mesa</button>
      <button type="button" data-modo="estudo" aria-pressed="${modo === "estudo"}">Estudar</button>
    </div>
    <div class="painel ${modo === "mesa" ? "on" : ""}" id="p-mesa">
      <div class="mesa">
        <p class="quando">${esc(t.quando)}</p>
        ${t.falas.map(f => `<p class="fala">${esc(f)}</p>`).join("")}
        <div class="evite">${t.evite.map(e => `<p><b>Evite:</b> \u201c${esc(e[0])}\u201d, ${esc(e[1])}</p>`).join("")}</div>
      </div>
      <div class="bloco">
        <h2>Minhas frases</h2>
        <textarea id="nota" placeholder="Escreva aqui as frases do seu jeito, uma por linha. Elas aparecem em destaque na sua mesa.">${esc(nota)}</textarea>
        <p class="salvo" id="salvo"></p>
        <p style="margin-top:14px">${estrela(t)} <span style="font-size:16px;color:var(--muted);vertical-align:middle">Levar para a próxima mesa</span></p>
      </div>
    </div>
    <div class="painel ${modo === "estudo" ? "on" : ""}" id="p-estudo">
      <div class="bloco">
        <h2>A técnica</h2>
        <p>${t.resumo}</p>
      </div>
      <div class="bloco" style="background:var(--tint)">
        <h2>Antes da mesa</h2>
        <ul>${t.preparo.map(p => `<li>${p}</li>`).join("")}</ul>
      </div>
      ${t.video ? `<div class="bloco">
        <h2>O vídeo</h2>
        <div class="tela"><button class="play" type="button" data-video="${t.video}" data-t="${esc(t.nome)}">Assistir</button></div>
        <a class="link" href="https://app.heygen.com/videos/${t.video}" target="_blank" rel="noopener">Abrir em outra aba</a>
      </div>` : `<div class="bloco"><h2>O vídeo</h2><p style="color:var(--muted)">Vídeo em produção.</p></div>`}
    </div>`;
  show("detalhe", t.nome);
}

function renderMinha() {
  const picks = T.filter(t => S.picks.includes(t.id));
  const el = $("#v-minha");
  if (!picks.length) {
    el.innerHTML = `<div class="vazio"><p>Nenhuma tática marcada.</p><p>Na lista, toque na estrela das duas ou três táticas que vai usar na próxima mesa. Elas aparecem aqui, em letra grande, para consulta rápida.</p><p><button class="btn claro" type="button" data-v="lista">Ver as táticas</button></p></div>`;
    return;
  }
  el.innerHTML = `<div class="minha">
    ${picks.map(t => `<div class="mesa"><h2>${esc(t.nome)}</h2><p class="quando">${esc(t.quando)}</p>
      ${t.falas.map(f => `<p class="fala">${esc(f)}</p>`).join("")}
      ${S.notes[t.id] && S.notes[t.id].trim() ? `<div class="quadro"><h3>Minhas frases</h3>${S.notes[t.id].split(/\n+/).filter(l => l.trim()).map(l => `<p>${esc(l.trim())}</p>`).join("")}</div>` : ""}</div>`).join("")}
    <div class="bloco">
      <h2>Depois da reunião</h2>
      <p style="color:var(--muted);font-size:16px">Qual tática você usou? O que aconteceu?</p>
      <textarea id="debrief">${esc(S.debrief)}</textarea>
      <p class="salvo" id="salvo2"></p>
      <p style="margin-top:14px"><button class="btn claro" type="button" id="limpar">Limpar seleção</button></p>
    </div></div>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, a");
  if (!b) return;
  if (b.dataset.open) { renderDetalhe(T.find(t => t.id === b.dataset.open), "mesa"); return; }
  if (b.dataset.pick) {
    const id = b.dataset.pick, i = S.picks.indexOf(id);
    if (i >= 0) S.picks.splice(i, 1); else S.picks.push(id);
    save();
    document.querySelectorAll(`[data-pick="${id}"]`).forEach(x => x.setAttribute("aria-pressed", String(i < 0)));
    return;
  }
  if (b.dataset.modo) {
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("#p-mesa").classList.toggle("on", b.dataset.modo === "mesa");
    $("#p-estudo").classList.toggle("on", b.dataset.modo === "estudo");
    return;
  }
  if (b.dataset.video) {
    b.parentElement.innerHTML = `<iframe src="https://app.heygen.com/embeds/${b.dataset.video}" title="${b.dataset.t}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
    return;
  }
  if (b.dataset.v) { renderLista(); if (b.dataset.v === "minha") renderMinha(); show(b.dataset.v); return; }
  if (b.id === "back") { renderLista(); show("lista"); return; }
  if (b.id === "limpar") { S.picks = []; S.debrief = ""; save(); renderMinha(); return; }
});

let timer;
document.addEventListener("input", e => {
  if (e.target.id === "nota" && atual) { S.notes[atual.id] = e.target.value; $("#salvo").textContent = "Salvando…"; }
  else if (e.target.id === "debrief") { S.debrief = e.target.value; $("#salvo2").textContent = "Salvando…"; }
  else return;
  clearTimeout(timer);
  timer = setTimeout(() => { save(); const s = $("#salvo") || $("#salvo2"); if (s) s.textContent = "Salvo neste aparelho."; }, 500);
});

renderLista();
</script>
</body>
</html>
